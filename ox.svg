<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 28" preserveAspectRatio="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3d12"/>
      <stop offset="0.45" stop-color="#c07f26"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="sheen2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="brass2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9b878"/>
      <stop offset="0.5" stop-color="#8a6a34"/>
      <stop offset="1" stop-color="#5c4520"/>
    </linearGradient>
  </defs>

  <!-- channel -->
  <rect x="0" y="3" width="400" height="22" rx="3" fill="#0b1119"/>
  <rect x="0.75" y="3.75" width="398.5" height="20.5" rx="2.5"
        fill="none" stroke="url(#brass2)" stroke-width="1.4"/>

  <!-- tick marks every 10% -->
  <g stroke="#3a4658" stroke-width="0.8" opacity="0.55">
    <line x1="40" y1="7" x2="40" y2="21"/>
    <line x1="80" y1="7" x2="80" y2="21"/>
    <line x1="120" y1="7" x2="120" y2="21"/>
    <line x1="160" y1="7" x2="160" y2="21"/>
    <line x1="200" y1="5" x2="200" y2="23"/>
    <line x1="240" y1="7" x2="240" y2="21"/>
    <line x1="280" y1="7" x2="280" y2="21"/>
    <line x1="320" y1="7" x2="320" y2="21"/>
    <line x1="360" y1="7" x2="360" y2="21"/>
  </g>

  <!-- arrow fill, tip at 46% -->
  <path d="M2,5 L170.0,5 L184.0,14 L170.0,23 L2,23 Z" fill="url(#flame)"/>
  <path d="M2,5 L170.0,5 L184.0,14 L170.0,23 L2,23 Z" fill="url(#sheen2)"/>
  <path d="M2,5 L170.0,5 L184.0,14 L170.0,23 L2,23 Z"
        fill="none" stroke="#ffe9b0" stroke-width="0.9" opacity="0.65"/>
</svg>
